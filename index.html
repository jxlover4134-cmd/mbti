<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 MBTI 스타일 진단</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 인쇄용 스타일 지정 (버튼 숨기기, 배경 흰색처리 등) */
        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .print-area { box-shadow: none !important; border: 1px solid #ddd; padding: 20px !important; }
            .gradient-text { background: none !important; color: #333 !important; -webkit-text-fill-color: #333 !important; }
        }

        /* Toast Message */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- 메인 컨테이너 -->
    <div id="app-container" class="w-full max-w-2xl bg-white rounded-3xl shadow-xl overflow-hidden relative min-h-[500px] flex flex-col print-area">
        
        <!-- 1. 시작 화면 -->
        <div id="view-start" class="flex-1 flex flex-col items-center justify-center p-8 text-center fade-in">
            <div class="w-24 h-24 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-4xl mb-6 shadow-inner">
                <i class="fas fa-brain"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">나의 진짜 모습 찾기</h1>
            <p class="text-gray-500 mb-8 max-w-md">
                12개의 간단한 질문을 통해 당신의 성격 유형(MBTI)과 숨겨진 잠재력을 확인해 보세요.
            </p>
            <button onclick="startQuiz()" class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-semibold py-3 px-10 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-200">
                테스트 시작하기
            </button>
        </div>

        <!-- 2. 테스트 화면 -->
        <div id="view-quiz" class="hidden flex-1 flex flex-col p-6 md:p-10">
            <div class="mb-8">
                <div class="flex justify-between text-sm text-gray-500 font-medium mb-2">
                    <span>진행률</span>
                    <span id="progress-text">1 / 12</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 8.33%"></div>
                </div>
            </div>
            
            <div class="flex-1 flex flex-col justify-center items-center text-center fade-in" id="question-container">
                <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-gray-800 mb-10 break-keep">
                    질문이 여기에 표시됩니다.
                </h2>
                <div class="w-full space-y-4">
                    <button onclick="selectAnswer('A')" id="btn-a" class="w-full text-left bg-gray-50 hover:bg-indigo-50 border-2 border-gray-100 hover:border-indigo-300 text-gray-700 font-medium py-4 px-6 rounded-2xl transition-all duration-200 shadow-sm text-lg">
                        A. 선택지 1
                    </button>
                    <button onclick="selectAnswer('B')" id="btn-b" class="w-full text-left bg-gray-50 hover:bg-indigo-50 border-2 border-gray-100 hover:border-indigo-300 text-gray-700 font-medium py-4 px-6 rounded-2xl transition-all duration-200 shadow-sm text-lg">
                        B. 선택지 2
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. 로딩 화면 -->
        <div id="view-loading" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-indigo-600 mb-4"></div>
            <h2 class="text-xl font-bold text-gray-800">결과를 분석하고 있습니다...</h2>
            <p class="text-gray-500 mt-2">당신의 답변을 종합하는 중입니다.</p>
        </div>

        <!-- 4. 결과 화면 -->
        <div id="view-result" class="hidden flex-1 flex flex-col p-6 md:p-10 overflow-y-auto">
            <div class="text-center mb-8 slide-up">
                <p class="text-indigo-600 font-semibold mb-2">당신의 성격 유형은</p>
                <h1 id="result-mbti" class="text-5xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-3 gradient-text">
                    MBTI
                </h1>
                <h2 id="result-title" class="text-2xl font-bold text-gray-800 mb-4">타이틀</h2>
                <p id="result-summary" class="text-gray-600 bg-gray-50 rounded-xl p-4 inline-block font-medium">
                    요약 설명이 여기에 들어갑니다.
                </p>
            </div>

            <div class="space-y-6 slide-up" style="animation-delay: 0.2s;">
                <div class="bg-blue-50/50 rounded-2xl p-6 border border-blue-100">
                    <h3 class="text-lg font-bold text-blue-800 mb-3 flex items-center">
                        <i class="fas fa-search-plus mr-2"></i> 상세 설명
                    </h3>
                    <p id="result-desc" class="text-gray-700 leading-relaxed text-sm md:text-base break-keep">
                        상세 설명 텍스트
                    </p>
                </div>
                
                <div class="bg-purple-50/50 rounded-2xl p-6 border border-purple-100">
                    <h3 class="text-lg font-bold text-purple-800 mb-3 flex items-center">
                        <i class="fas fa-lightbulb mr-2"></i> 강점 및 특징
                    </h3>
                    <ul id="result-traits" class="list-disc list-inside text-gray-700 space-y-2 text-sm md:text-base">
                        <!-- 강점 리스트 -->
                    </ul>
                </div>
            </div>

            <!-- 액션 버튼 (인쇄 시 숨김) -->
            <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center no-print slide-up" style="animation-delay: 0.4s;">
                <button onclick="saveResult()" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white font-semibold py-3 px-6 rounded-xl shadow transition duration-200 flex items-center justify-center">
                    <i class="fas fa-download mr-2"></i> 결과 저장 (TXT)
                </button>
                <button onclick="printResult()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl shadow transition duration-200 flex items-center justify-center">
                    <i class="fas fa-print mr-2"></i> 결과 인쇄
                </button>
                <button onclick="resetQuiz()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 px-6 rounded-xl shadow transition duration-200 flex items-center justify-center">
                    <i class="fas fa-redo mr-2"></i> 다시하기
                </button>
            </div>
        </div>

    </div>

    <!-- 토스트 알림창 -->
    <div id="toast">저장되었습니다!</div>

    <script>
        // 1. 질문 데이터 세트 (총 12문항)
        const questions = [
            { id: 1, type: 'EI', text: "주말에 시간이 생겼을 때, 당신이 선호하는 휴식 방법은?", a: "친구들과 만나 신나게 놀며 스트레스를 푼다. (E)", b: "집에서 혼자 영화를 보거나 취미생활을 하며 쉰다. (I)", aVal: 'E', bVal: 'I' },
            { id: 2, type: 'EI', text: "새로운 모임에 참석했을 때 당신의 행동은?", a: "먼저 사람들에게 다가가 대화를 주도한다. (E)", b: "누군가 말을 걸어올 때까지 조용히 상황을 지켜본다. (I)", aVal: 'E', bVal: 'I' },
            { id: 3, type: 'EI', text: "스트레스를 받을 때 당신은 어떻게 해결하나요?", a: "주변 사람들과 대화를 나누며 털어놓는다. (E)", b: "혼자만의 시간을 가지며 생각을 정리한다. (I)", aVal: 'E', bVal: 'I' },
            
            { id: 4, type: 'SN', text: "업무나 과제를 처리할 때 당신의 스타일은?", a: "실용적이고 현실적인, 검증된 방식을 선호한다. (S)", b: "새롭고 창의적인, 남들이 안 해본 방식을 시도한다. (N)", aVal: 'S', bVal: 'N' },
            { id: 5, type: 'SN', text: "대화를 나눌 때 주로 어떤 주제를 좋아하나요?", a: "일상적인 사건, 구체적인 사실이나 경험. (S)", b: "미래의 가능성, 추상적인 개념이나 우주/철학 이야기. (N)", aVal: 'S', bVal: 'N' },
            { id: 6, type: 'SN', text: "어떤 물건을 조립할 때 당신은?", a: "설명서를 처음부터 끝까지 꼼꼼히 읽고 따라 한다. (S)", b: "설명서를 대충 보고 직관적으로 조립해 본다. (N)", aVal: 'S', bVal: 'N' },
            
            { id: 7, type: 'TF', text: "친구가 '나 우울해서 화분 샀어'라고 할 때 당신의 반응은?", a: "'무슨 화분 샀어? 물은 얼마나 줘야 해?' (T)", b: "'무슨 일 있어? 왜 우울해 ㅠㅠ' (F)", aVal: 'T', bVal: 'F' },
            { id: 8, type: 'TF', text: "중요한 결정을 내려야 할 때 가장 중요하게 생각하는 것은?", a: "객관적인 데이터, 논리, 그리고 공정성. (T)", b: "관련된 사람들의 감정, 조화, 그리고 가치관. (F)", aVal: 'T', bVal: 'F' },
            { id: 9, type: 'TF', text: "누군가 실수를 했을 때 당신의 조언 방식은?", a: "무엇이 잘못되었는지 정확히 짚고 해결책을 제시한다. (T)", b: "우선 감정을 다독여주고 부드럽게 이야기해 준다. (F)", aVal: 'T', bVal: 'F' },
            
            { id: 10, type: 'JP', text: "여행을 떠나기 전 당신의 준비 방식은?", a: "일정, 숙소, 맛집 등을 엑셀로 상세히 계획해 둔다. (J)", b: "대략적인 목적지만 정하고 발길 닿는 대로 다닌다. (P)", aVal: 'J', bVal: 'P' },
            { id: 11, type: 'JP', text: "일상 생활에서의 당신의 공간(방, 책상)은?", a: "물건들이 제자리에 잘 정돈되어 있는 편이다. (J)", b: "조금 어질러져 있지만 나름의 규칙이 있다. (P)", aVal: 'J', bVal: 'P' },
            { id: 12, type: 'JP', text: "마감 기한이 있는 과제가 주어졌을 때?", a: "미리미리 스케줄을 짜서 여유 있게 끝낸다. (J)", b: "마감일 직전까지 미루다가 엄청난 집중력을 발휘한다. (P)", aVal: 'J', bVal: 'P' },
        ];

        // 2. 결과 데이터 (16가지 MBTI 상세 설명)
        const mbtiResults = {
            "ISTJ": { title: "청렴결백한 논리주의자", summary: "사실에 근거하여 책임감 있게 일하는 철저한 성격", desc: "당신은 조용하고 신중하며, 집중력이 뛰어나고 매사에 철저합니다. 구체적이고 현실적인 사실을 바탕으로 논리적으로 결정을 내리며, 한 번 시작한 일은 끝까지 책임감 있게 완수합니다. 신뢰할 수 있고 규칙을 잘 지키는 든든한 사람입니다.", traits: ["책임감이 강함", "현실적이고 실용적", "체계적이고 정돈된 라이프스타일"] },
            "ISFJ": { title: "용감한 수호자", summary: "헌신적이고 따뜻하며 사람들을 보호하는 성격", desc: "조용하고 차분하며, 따뜻한 마음을 가진 당신은 타인의 감정을 잘 살피고 배려합니다. 책임감이 강하고 헌신적이며, 자신이 맡은 바를 묵묵히 다해냅니다. 주변 사람들에게 든든한 버팀목이 되어주는 따뜻한 수호자입니다.", traits: ["세심한 배려", "높은 책임감과 인내심", "안정감과 전통을 중시함"] },
            "INFJ": { title: "선의의 옹호자", summary: "통찰력 있고 사람들에게 영감을 주는 이상주의자", desc: "당신은 깊은 통찰력과 직관력을 바탕으로 사람들의 내면을 잘 이해합니다. 이상주의적이며, 자신만의 확고한 신념과 가치관을 가지고 있습니다. 겉으로는 조용해 보이지만, 마음속에는 열정과 영감이 가득 차 있는 사람입니다.", traits: ["강한 직관력", "타인에 대한 깊은 공감", "완벽주의적 성향"] },
            "INTJ": { title: "용의주도한 전략가", summary: "독창적이고 분석적인 사고를 가진 시스템 빌더", desc: "독립적이고 분석적인 사고력을 가진 당신은 논리적이고 객관적인 기준으로 세상을 바라봅니다. 전체적인 큰 그림을 보는 데 능하며, 장기적인 비전과 전략을 세우는 것을 즐깁니다. 지적 호기심이 많고 문제 해결 능력이 뛰어납니다.", traits: ["전략적 사고", "강한 독립성", "높은 지적 호기심"] },
            "ISTP": { title: "만능 재주꾼", summary: "뛰어난 적응력과 논리적인 분석력을 가진 성격", desc: "조용하고 관찰력이 뛰어나며, 상황에 대한 적응력이 매우 빠릅니다. 논리적이고 현실적이며, 도구나 기계를 다루는 데 능숙한 경우가 많습니다. 불필요한 에너지를 낭비하지 않고 효율적으로 문제를 해결하는 실용주의자입니다.", traits: ["뛰어난 위기 대처 능력", "논리적이고 객관적", "자유를 중시함"] },
            "ISFP": { title: "호기심 많은 예술가", summary: "따뜻하고 감수성이 풍부한 자유로운 영혼", desc: "당신은 온화하고 겸손하며, 타인에게 관대하고 친절합니다. 현재의 순간을 즐기고 예술적인 감각이 뛰어나며, 자신만의 가치관과 내면의 조화를 중요하게 생각합니다. 틀에 얽매이는 것을 싫어하는 자유로운 영혼입니다.", traits: ["풍부한 감수성", "뛰어난 미적 감각", "유연하고 적응력이 좋음"] },
            "INFP": { title: "열정적인 중재자", summary: "이상주의적이고 이타적인 내면의 탐구자", desc: "이상주의자이자 낭만주의자인 당신은 깊은 감수성과 따뜻한 마음을 가지고 있습니다. 자신만의 가치관을 매우 중요하게 생각하며, 타인을 돕고 세상을 더 나은 곳으로 만들고 싶어 합니다. 창의적이고 상상력이 풍부합니다.", traits: ["강한 공감 능력", "이타주의", "창의력과 상상력"] },
            "INTP": { title: "논리적인 사색가", summary: "호기심 많고 지적 탐구를 즐기는 철학자", desc: "조용하고 과묵하지만 관심 있는 분야에서는 말을 잘합니다. 분석적이고 논리적이며, 복잡한 문제를 해결하거나 이론적인 개념을 탐구하는 것을 좋아합니다. 독창적인 아이디어와 뛰어난 문제 해결 능력을 가진 사색가입니다.", traits: ["뛰어난 분석력", "지적 호기심", "비판적 사고"] },
            "ESTP": { title: "모험을 즐기는 사업가", summary: "행동력이 뛰어나고 스릴을 즐기는 활동가", desc: "현실적이고 관찰력이 뛰어나며, 문제 해결에 있어 매우 실용적인 접근을 합니다. 에너지가 넘치고 사람들과 어울리는 것을 좋아하며, 모험과 스릴을 즐깁니다. 순발력이 뛰어나고 위기 상황에서도 침착하게 대처합니다.", traits: ["강한 행동력", "뛰어난 적응력", "직설적이고 솔직함"] },
            "ESFP": { title: "자유로운 영혼의 연예인", summary: "주변을 즐겁게 만들고 현재를 즐기는 성격", desc: "당신은 사교적이고 활동적이며, 긍정적인 에너지로 주변 사람들을 즐겁게 만듭니다. 사람들의 관심을 받는 것을 좋아하고, 현실적이고 실용적인 감각도 갖추고 있습니다. 인생을 즐기고 현재의 순간에 충실한 사람입니다.", traits: ["뛰어난 사교성", "긍정적인 에너지", "뛰어난 관찰력"] },
            "ENFP": { title: "재기발랄한 활동가", summary: "열정적이고 상상력이 풍부한 자유로운 영혼", desc: "에너지가 넘치고 열정적이며, 상상력이 풍부한 당신은 새로운 가능성을 탐구하는 것을 좋아합니다. 사람들에 대한 관심이 많고 공감 능력이 뛰어나며, 다른 사람들에게 동기를 부여하는 데 탁월한 능력을 가지고 있습니다.", traits: ["풍부한 상상력", "뛰어난 소통 능력", "긍정적이고 낙천적"] },
            "ENTP": { title: "뜨거운 논쟁을 즐기는 변론가", summary: "독창적이고 지적인 도전을 즐기는 혁신가", desc: "당신은 두뇌 회전이 빠르고 독창적이며, 다방면에 재능이 많습니다. 새로운 아이디어를 내고 논리적으로 토론하는 것을 즐기며, 끊임없이 지적인 도전을 추구합니다. 문제의 본질을 파악하고 혁신적인 해결책을 제시합니다.", traits: ["창의적인 문제 해결", "뛰어난 언변", "지적 호기심"] },
            "ESTJ": { title: "엄격한 관리자", summary: "체계적이고 현실적인 사실 중심의 리더", desc: "현실적이고 구체적이며, 사실에 바탕을 두고 체계적으로 일을 처리합니다. 리더십이 뛰어나고 조직을 관리하는 데 능숙하며, 규칙과 질서를 중요하게 생각합니다. 책임감이 강하고 목표 달성을 위해 헌신하는 성격입니다.", traits: ["강한 추진력", "체계적인 조직력", "현실적이고 객관적"] },
            "ESFJ": { title: "사교적인 외교관", summary: "따뜻하고 책임감 있는 헌신적인 리더", desc: "동정심이 많고 다른 사람에게 관심을 쏟으며, 인화를 중요하게 생각합니다. 책임감이 강하고 성실하며, 다른 사람들을 돕는 데서 기쁨을 느낍니다. 사교성이 뛰어나고 주변 사람들과 긍정적인 관계를 맺는 데 탁월합니다.", traits: ["뛰어난 공감 능력", "강한 책임감", "조화와 협력 중시"] },
            "ENFJ": { title: "정의로운 사회운동가", summary: "카리스마 있고 열정적인 타고난 리더", desc: "당신은 따뜻하고 공감 능력이 뛰어나며, 사람들을 이끌고 동기를 부여하는 데 탁월한 능력이 있습니다. 타인의 성장을 돕는 것을 좋아하며, 직관력과 융통성이 있어 다양한 사람들과 잘 어울립니다. 진정성 있는 타고난 리더입니다.", traits: ["강한 리더십", "타인에 대한 깊은 공감", "설득력과 언변"] },
            "ENTJ": { title: "대담한 통솔자", summary: "결단력 있고 비전이 있는 전략적 리더", desc: "당신은 타고난 리더로서, 장기적인 비전을 세우고 목표를 달성하기 위해 단호하게 행동합니다. 논리적이고 분석적이며, 비효율적인 것을 싫어합니다. 자신감이 넘치고 도전적인 상황에서도 주도권을 잡고 일을 추진합니다.", traits: ["전략적 비전", "강한 결단력", "논리적이고 분석적"] }
        };

        // 3. 상태 관리 변수
        let currentStep = 0;
        let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        let finalMbti = "";

        // DOM 요소 캐싱
        const views = {
            start: document.getElementById('view-start'),
            quiz: document.getElementById('view-quiz'),
            loading: document.getElementById('view-loading'),
            result: document.getElementById('view-result')
        };
        const questionText = document.getElementById('question-text');
        const btnA = document.getElementById('btn-a');
        const btnB = document.getElementById('btn-b');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        // 4. 앱 로직 함수
        function showView(viewName) {
            Object.values(views).forEach(v => v.classList.add('hidden'));
            views[viewName].classList.remove('hidden');
        }

        function startQuiz() {
            currentStep = 0;
            scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
            showView('quiz');
            renderQuestion();
        }

        function renderQuestion() {
            // 애니메이션 초기화를 위해 클래스 제거 후 다시 추가
            const qContainer = document.getElementById('question-container');
            qContainer.classList.remove('fade-in');
            void qContainer.offsetWidth; // trigger reflow
            qContainer.classList.add('fade-in');

            const q = questions[currentStep];
            questionText.textContent = q.text;
            btnA.textContent = q.a;
            btnB.textContent = q.b;

            // 프로그래스 바 업데이트
            const percent = ((currentStep + 1) / questions.length) * 100;
            progressBar.style.width = percent + '%';
            progressText.textContent = `${currentStep + 1} / ${questions.length}`;
        }

        function selectAnswer(choice) {
            const q = questions[currentStep];
            if (choice === 'A') scores[q.aVal]++;
            else scores[q.bVal]++;

            currentStep++;

            if (currentStep < questions.length) {
                renderQuestion();
            } else {
                calculateResult();
            }
        }

        function calculateResult() {
            showView('loading');

            // MBTI 로직 계산
            let result = "";
            result += (scores.E >= scores.I) ? "E" : "I";
            result += (scores.S >= scores.N) ? "S" : "N";
            result += (scores.T >= scores.F) ? "T" : "F";
            result += (scores.J >= scores.P) ? "J" : "P";
            
            finalMbti = result;

            // 결과 화면 렌더링 준비 (로딩 연출 1.5초)
            setTimeout(() => {
                renderResult();
                showView('result');
            }, 1500);
        }

        function renderResult() {
            const data = mbtiResults[finalMbti];
            
            document.getElementById('result-mbti').textContent = finalMbti;
            document.getElementById('result-title').textContent = data.title;
            document.getElementById('result-summary').textContent = data.summary;
            document.getElementById('result-desc').textContent = data.desc;
            
            const traitsUl = document.getElementById('result-traits');
            traitsUl.innerHTML = "";
            data.traits.forEach(trait => {
                const li = document.createElement('li');
                li.textContent = trait;
                traitsUl.appendChild(li);
            });
        }

        function resetQuiz() {
            showView('start');
        }

        // 5. 부가 기능 (인쇄, 저장, 토스트)
        function printResult() {
            window.print();
        }

        function saveResult() {
            const data = mbtiResults[finalMbti];
            const date = new Date().toLocaleDateString('ko-KR');
            
            // 저장할 텍스트 포맷 구성
            const textContent = `
=========================================
나만의 MBTI 진단 결과
=========================================
진단일: ${date}

[나의 유형]: ${finalMbti}
[타이틀]: ${data.title}
[한줄요약]: ${data.summary}

[상세설명]
${data.desc}

[주요 강점 및 특징]
${data.traits.map(t => '- ' + t).join('\n')}

=========================================
`;
            // Blob을 이용하여 파일 생성 및 다운로드
            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `MBTI_결과_${finalMbti}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast("결과가 텍스트 파일로 저장되었습니다!");
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

    </script>
</body>
